<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="7+ лет опыта; 31 AI-продукт на одном ядре; 151+ нейросеть на одном шлюзе; 2M+ пользователей; команда из 8 инженеров; 95%+ успешных платежей">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b1124"/>
      <stop offset="1" stop-color="#151036"/>
    </linearGradient>
    <linearGradient id="num" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a99bff"/>
    </linearGradient>
    <style>
      .t { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; text-anchor: middle; }
      .n { font-size: 40px; font-weight: 800; fill: url(#num); }
      .l { font-size: 14px; font-weight: 500; fill: #aab6e8; }
      .cell { animation: rise .9s ease-out both; }
      .c2 { animation-delay: .1s } .c3 { animation-delay: .2s } .c4 { animation-delay: .3s } .c5 { animation-delay: .4s } .c6 { animation-delay: .5s }
      @keyframes rise { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
    </style>
  </defs>
  <rect width="1200" height="150" rx="16" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="149" rx="16" fill="none" stroke="#8fa2ff" stroke-opacity="0.18"/>
  <g stroke="#8fa2ff" stroke-opacity="0.15">
    <line x1="200" y1="28" x2="200" y2="122"/><line x1="400" y1="28" x2="400" y2="122"/>
    <line x1="600" y1="28" x2="600" y2="122"/><line x1="800" y1="28" x2="800" y2="122"/>
    <line x1="1000" y1="28" x2="1000" y2="122"/>
  </g>
  <g class="t">
    <g class="cell"><text class="n" x="100" y="78">7+</text><text class="l" x="100" y="104">лет в разработке</text></g>
    <g class="cell c2"><text class="n" x="300" y="78">31</text><text class="l" x="300" y="104">AI-продукт</text><text class="l" x="300" y="122">на одном ядре</text></g>
    <g class="cell c3"><text class="n" x="500" y="78">151+</text><text class="l" x="500" y="104">нейросеть на</text><text class="l" x="500" y="122">одном шлюзе</text></g>
    <g class="cell c4"><text class="n" x="700" y="78">2M+</text><text class="l" x="700" y="104">пользователей</text><text class="l" x="700" y="122">Web3-платформы</text></g>
    <g class="cell c5"><text class="n" x="900" y="78">8</text><text class="l" x="900" y="104">инженеров</text><text class="l" x="900" y="122">в команде</text></g>
    <g class="cell c6"><text class="n" x="1100" y="78">95%+</text><text class="l" x="1100" y="104">успешных</text><text class="l" x="1100" y="122">платежей</text></g>
  </g>
</svg>
